<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release, live</title>
<style>
:root{
  --ground:#F3EADB; --card:#FFFCF7; --sunk:#FBEBD3; --ink:#1F1B16; --ink2:#5E554A; --ink3:#8A7F71;
  --rule:#EADBC4; --ember:#E8590C; --good:#1B7F4C; --warn:#B7791F; --bad:#C0392B;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --ground:#16130F; --card:#1F1B16; --sunk:#2A241D; --ink:#F3EADB; --ink2:#C9BCA8; --ink3:#9A8D7B;
  --rule:#3A3228; --ember:#F07A2A; --good:#4CC38A; --warn:#E0A840; --bad:#F06A5A; color-scheme:dark;}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;padding-inline:16px}
.page{max-width:1280px;margin:0 auto;padding-block:20px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:16px}
h1{font-size:22px;margin:0}
.meta{color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:22px 0 8px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.dot.ok{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 20%,transparent);animation:pulse 2s infinite}
.dot.slow{background:var(--warn)} .dot.stuck{background:var(--bad)}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--good) 0%,transparent)}}
.title{font-weight:600;line-height:1.3}
.sub{color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}
.sub a{color:inherit}
.said{color:var(--ink2);font-size:13px;border-left:2px solid var(--rule);padding-left:9px}
details summary{cursor:pointer;color:var(--ink3);font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
td{padding:8px 12px;border-top:1px solid var(--rule);font-size:13px;vertical-align:top}
tr:first-child td{border-top:0}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.neutral{background:color-mix(in srgb,var(--ink3) 16%,transparent);color:var(--ink2)}
.ran{color:var(--ink3);font-size:12px;margin-top:3px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink2)}
.tablewrap{overflow-x:auto}
.empty{color:var(--ink3)}
.banner{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:10px;padding:12px 14px;margin-bottom:6px}
.banner[hidden]{display:none}
.banner .dot{background:var(--warn)}
.banner b{display:block;font-size:15px}
.banner span{color:var(--ink2);font-size:13px}
.note{color:var(--ink2);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.scope{color:var(--ink3);font-size:12px;white-space:nowrap}

/* the digest: one headline, then one plain row per thing */
.headline{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin-bottom:6px}
.big{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big small{font-size:16px;font-weight:600;color:var(--ink2);letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--rule);background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--ink2);white-space:nowrap}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip.zero{opacity:.55}
.chip.muted{background:transparent;color:var(--ink3);border-style:dashed}
.chip.muted b{color:var(--ink3)}
.today{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;font-size:15px}
.today b{font-size:20px;font-variant-numeric:tabular-nums}
.delta{font-weight:600;font-size:14px}
.delta.ok{color:var(--good)} .delta.bad{color:var(--bad)} .delta.neutral{color:var(--ink3)}
.rows{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--rule);min-width:0}
.row:first-child{border-top:0}
.row .main{min-width:0;flex:1}
.row .title{font-size:14px;overflow-wrap:anywhere}
.row .line{color:var(--ink3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .step{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .step b{color:var(--ember);font-weight:600}
.allclear{background:color-mix(in srgb,var(--good) 12%,var(--card));border:1px solid color-mix(in srgb,var(--good) 40%,transparent);color:var(--good);border-radius:10px;padding:12px 14px;font-weight:600}
details.fold>summary{cursor:pointer;list-style:none;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:22px 0 8px;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'▸ ';}
details.fold[open]>summary::before{content:'▾ ';}
details.fold>summary span{text-transform:none;letter-spacing:0;font-weight:500}
footer{margin-top:26px;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums;line-height:1.7;border-top:1px solid var(--rule);padding-top:10px}
a{color:inherit}
.progress{margin:4px 0 12px}
.ptitle{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:6px}
.bar{height:12px;border-radius:999px;background:var(--sunk);border:1px solid var(--rule);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:999px}
.pline{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin-top:6px;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pline b{color:var(--ink)}
.pace.ok{color:var(--good);font-weight:600} .pace.bad{color:var(--bad);font-weight:600}
.week{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
.days{display:flex;gap:6px;align-items:flex-end;height:64px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;width:26px}
.pair{display:flex;gap:2px;align-items:flex-end;height:48px}
.pair i{display:block;width:9px;border-radius:2px 2px 0 0;min-height:1px}
.pair i.add{background:var(--ink3);opacity:.55} .pair i.done{background:var(--good)}
.day span{font-size:10px;color:var(--ink3)}
.day.today span{color:var(--ink);font-weight:600}
.legend{font-size:12px;color:var(--ink3);display:flex;flex-direction:column;gap:2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.spark{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink3)}
.spark svg{color:var(--ember)}
@media (max-width:520px){.big{font-size:28px}.row{padding:10px 12px}}
</style>
</head>
<body>
<div class="page">
  <header><h1>Release, live</h1><span class="meta" id="meta">loading…</span></header>
  <div class="banner" id="hold" role="status" hidden></div>
  <section class="headline" id="headline"><div class="ptitle">Release progress</div><div class="big">Release: counting…</div></section>
  <h2>Today</h2>
  <div class="today" id="today"><span class="empty">Not read yet.</span></div>
  <h2 id="buildinghead">Building now</h2>
  <div id="building"></div>
  <h2 id="needshead">Needs you</h2>
  <div id="needs"></div>
  <details class="fold" id="donefold"><summary id="donehead">Finished recently</summary>
    <div class="tablewrap"><table id="done"></table></div></details>
  <footer id="machine">Machine: not read yet.</footer>
</div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const ago = (sec) => sec == null ? '—' : sec < 60 ? `${sec}s ago` : sec < 3600 ? `${Math.round(sec/60)} min ago` : `${Math.round(sec/3600)} h ago`
const dur = (min) => min < 60 ? `${min} min` : `${Math.floor(min/60)} h ${min%60} min`
let repo = ''
// An instant the reader can act on: "Tue 20 Oct, 20:00". A bare reset wording
// ("7:20pm") is shown as it was written.
const when = (u) => {
  const d = /^\d{4}-\d{2}-\d{2}T/.test(u || '') ? new Date(u) : null
  if (!d || isNaN(d)) return u || ''
  return d.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
}
function holdBanner(h){
  const el = document.getElementById('hold')
  if (!h || !h.held) { el.hidden = true; el.innerHTML = ''; return }
  const head = h.kind === 'usage'
    ? `Not starting new work: ${esc(h.reason || 'the usage limit was reached')}`
    : `Not starting new work: paused by the owner`
  const sub = h.kind === 'usage'
    ? (h.until ? `Starts again ${esc(when(h.until))}. Work already running carries on.` : 'Work already running carries on.')
    : `${esc(h.reason || '')}${h.reason ? '. ' : ''}Work already running carries on.`
  el.innerHTML = `<span class="dot"></span><div><b>${head}</b><span>${sub}</span></div>`
  el.hidden = false
}

// One plain row per builder: what it is, how far along, how long, what it last did.
const STEP_WORD = { 'Set up': 'Setting up', Plan: 'Planning', Build: 'Building', Check: 'Checking',
  Review: 'Being reviewed', PR: 'Opening the pull request', Merged: 'Merging',
  'Back on the PR': 'Going back to the pull request', Repair: 'Repairing', Fix: 'Fixing', Record: 'Recording', Push: 'Pushing the fix' }
function stepText(p){
  if (!p || !p.of || (p.unreadable || []).length === p.of) return '<b>Starting</b>'
  const name = (p.steps || [])[p.step - 1]?.name || ''
  return `${p.repair ? 'Repair · ' : ''}${esc(p.step)} of ${esc(p.of)} · <b>${esc(STEP_WORD[name] || name)}</b>`
}
const ticketLink = (n, kind = 'issues') => repo
  ? `<a href="https://github.com/${esc(repo)}/${kind}/${esc(n)}" target="_blank" rel="noopener">#${esc(n)}</a>` : `#${esc(n)}`
function buildRow(a){
  const q = a.quietSec ?? 99999
  const cls = q < 90 ? 'ok' : q < 600 ? 'slow' : 'stuck'
  const last = a.steps?.length ? a.steps[a.steps.length - 1].text : 'No activity yet'
  return `<div class="row build"><span class="dot ${cls}" title="last active ${esc(ago(a.quietSec))}"></span><div class="main">
    <div class="title">${esc(a.short || a.title)} <span class="sub">${ticketLink(a.ticket)}</span></div>
    <div class="step">${stepText(a.progress)} · ${esc(dur(a.startedAgoMin))} running</div>
    <div class="line" title="${esc(last)}">${esc(last)}</div></div></div>`
}
const num = (n) => Number(n).toLocaleString()
const DAY = (d) => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd) }
const dayName = (d) => DAY(d).toLocaleDateString(undefined, { weekday: 'short' })
const dateName = (d) => DAY(d).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })
function spark(vals){
  const w = 120, h = 28, max = Math.max(1, ...vals)
  const pts = vals.map((v, i) => `${(i * w / Math.max(1, vals.length - 1)).toFixed(1)},${(h - 2 - v * (h - 4) / max).toFixed(1)}`).join(' ')
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`
}
// The release: every release ticket done since the start date plus every one still
// open, as the big number, then the bar of done against it.
// What was left out of it and why, so the number can be checked against the board.
function outsideLine(b){
  const o = b?.outside
  if (!o) return ''
  const pri = (b.lowerPriorities || []).map(p => p === 'none' ? 'no priority' : p).join('/')
  const parts = [[o.lower, `lower-priority${pri ? ` (${esc(pri)})` : ''}`], [o.post, 'post-launch'],
    [(o.batch || 0) + (o.epic || 0), 'wrappers'], [o.parked, 'parked']]
    .filter(([n]) => n).map(([n, w]) => `${num(n)} ${w}`)
  return parts.length ? `<div class="sub outside">Outside the release: ${parts.join(' · ')}</div>` : ''
}
// The left side, split as the coordinator splits it: product first, our own tooling after.
const splitLine = (l) => l && Number.isInteger(l.product) && Number.isInteger(l.tooling)
  ? `<div class="pline split"><span>Left: Product <b>${num(l.product)}</b> · Our tooling <b>${num(l.tooling)}</b></span></div>` : ''
function releaseTop(l, b){
  if (!l) return '<div class="ptitle">Release progress</div><div class="big">Release: counting…</div>'
    + '<div class="sub">The release total lands with the next count.</div>' + outsideLine(b)
  return `<div class="ptitle">Release progress</div><div class="big">Release: ${num(l.total)} <small>tickets</small></div>
    <div class="progress"><div class="bar" role="img" aria-label="${esc(l.pct)}% done"><i style="width:${Math.min(100, l.pct)}%"></i></div>
    <div class="pline"><span><b>${num(l.done)}</b> done · <b>${num(l.open)}</b> left · <b>${esc(l.pct)}%</b></span><span class="sub">counted since ${esc(dateName(l.base))}</span></div>${splitLine(l)}</div>${outsideLine(b)}`
}
// Added against done for each of the last seven days and today, with the pace and where it lands.
function paceBlock(l){
  if (!l) return ''
  const pace = l.burn == null ? '' : l.converging
    ? `<span class="pace ok">Shrinking ${num(l.burn)}/day</span><span>At this pace: <b>${esc(dateName(l.eta))}</b></span>`
    : `<span class="pace bad">Not converging: +${num(Math.abs(l.burn))}/day</span>`
  const max = Math.max(1, ...l.days.map(d => Math.max(d.added, d.done)))
  const hgt = (n) => `${Math.round(n * 48 / max)}px`
  const days = l.days.map((d, i) => `<div class="day${i === l.days.length - 1 ? ' today' : ''}" title="${esc(d.day)}: ${d.added} added, ${d.done} done, ${d.merged} merged">
    <div class="pair"><i class="add" style="height:${hgt(d.added)}"></i><i class="done" style="height:${hgt(d.done)}"></i></div>
    <span>${i === l.days.length - 1 ? 'Today' : esc(dayName(d.day))}</span></div>`).join('')
  return `<div class="ptitle" style="margin-top:16px">Added and done, per day</div>
    <div class="week"><div class="days">${days}</div>
      <div class="legend"><span><i style="background:var(--ink3);opacity:.55"></i>added</span><span><i style="background:var(--good)"></i>done</span></div></div>
    <div class="pline">${pace}</div>`
}
function mergedBlock(l){
  if (!l) return ''
  const merged = l.days.map(d => d.merged)
  return `<div class="ptitle" style="margin-top:16px">Pull requests merged, per day</div>
    <div class="spark">${spark(merged)}<span>${num(merged.slice(0, -1).reduce((a, b) => a + b, 0))} in the last seven days · ${num(merged[merged.length - 1])} today</span></div>`
}
function headline(b, l){
  if (!b) return releaseTop(null, null)
  const chips = b.buckets.map(c => `<span class="chip${c.n ? '' : ' zero'}" data-k="${esc(c.key)}"><b>${num(c.n)}</b> ${esc(c.label)}</span>`)
  return `${releaseTop(l, b)}<div class="chips">${chips.join('')}</div>${paceBlock(l)}${mergedBlock(l)}`
}
function todayLine(t){
  if (!t) return '<span class="empty">Today’s counts land with the next full count.</span>'
  const v = (n) => n == null ? '—' : num(n)
  const d = t.delta
  const delta = d == null ? '' : d > 0 ? `<span class="delta ok">List shrinking by ${num(d)}</span>`
    : d < 0 ? `<span class="delta bad">List growing by ${num(-d)}</span>` : '<span class="delta neutral">List holding steady</span>'
  return `<span><b>${v(t.merged)}</b> merged</span><span><b>${v(t.done)}</b> done</span><span><b>${v(t.made)}</b> new</span>${delta}`
}
const NEEDS_SHOWN = 8
function needsList(b){
  if (!b) return '<p class="empty">Not read yet.</p>'
  if (!b.needsYou.length) return '<div class="allclear">Nothing needs you</div>'
  const row = (n) => `<div class="row need"><div class="main"><div class="title">${esc(n.title)}</div>
    <div class="sub">${esc(n.why)} · ${n.kind === 'pr' ? `pull request ${ticketLink(n.number, 'pull')}` : ticketLink(n.number)}</div></div></div>`
  const head = b.needsYou.slice(0, NEEDS_SHOWN).map(row).join('')
  const rest = b.needsYou.slice(NEEDS_SHOWN)
  return `<div class="rows">${head}</div>` + (rest.length
    ? `<details><summary>${rest.length} more</summary><div class="rows" style="margin-top:6px">${rest.map(row).join('')}</div></details>` : '')
}
function machineLine(s){
  const c = s.capacity, u = s.usage, parts = []
  const bs = (n) => `${n} builder${n === 1 ? '' : 's'}`
  parts.push(c && c.ceiling != null ? `${s.live.length} of ${bs(c.ceiling)} running` : `${bs(s.live.length)} running`)
  const r = String(c?.reading || '')
  const cpu = /cpu idle (\d+)%/.exec(r), mem = /(\d+(?:\.\d+)?) GB free/.exec(r)
  if (cpu) parts.push(`CPU ${100 - Number(cpu[1])}% busy`)
  if (mem) parts.push(`${mem[1]} GB memory free`)
  parts.push(u ? `5-hour usage ${esc(u.pct)}%, resets ${esc(when(u.resets))}` : '5-hour usage not read yet')
  const hosts = (s.hosts || []).map(h => `${esc(h.host)} (${esc(h.n)})`).join(', ')
  return `Machine: ${parts.join(' · ')}<br>Building on: ${hosts || 'no host'} · updated ${esc(new Date(s.at).toLocaleTimeString())}`
}

// Where the ticket stands now, not how its last run ended: a run that parked on a
// question and went back on the queue is not a failure. Only a true stop is red.
const TONES = { ok: 'ok', warn: 'warn', bad: 'bad', neutral: 'neutral' }
function nowPill(d){
  const n = d.now || { text: d.exit === 0 ? 'Finished' : 'Stopped', tone: d.exit === 0 ? 'neutral' : 'bad' }
  const [head, ...rest] = String(n.text).split(' — ')
  const pr = n.pr && repo ? ` — <a href="https://github.com/${esc(repo)}/pull/${esc(n.pr)}" target="_blank" rel="noopener">PR #${esc(n.pr)}</a>` : ''
  const tail = pr || (rest.length ? `<div class="note">${esc(rest.join(' — '))}</div>` : '')
  return `<span class="pill ${TONES[n.tone] || 'neutral'}">${esc(head)}</span>${tail}`
}
function ranOut(d){
  if (d.outcome === 'error_max_budget_usd') return 'Last run ran out of budget'
  if (d.exit === 0) return 'Last run finished'
  return `Last run ended (exit ${esc(d.exit)})`
}
function doneRow(d){
  const link = repo ? `<a href="https://github.com/${esc(repo)}/issues/${esc(d.ticket)}" target="_blank" rel="noopener">#${esc(d.ticket)}</a>` : `#${esc(d.ticket)}`
  return `<tr>
      <td>${nowPill(d)}</td>
      <td><b>${esc(d.title)}</b> <span class="sub">${link}</span><div class="ran">${ranOut(d)}</div><details><summary>What it reported</summary><div class="said" style="margin-top:6px">${esc(d.summary || 'No report.')}</div></details></td>
      <td class="num">${d.cost != null ? '$'+d.cost.toFixed(0) : '—'}</td>
      <td class="num">${ago(d.endedAgoMin*60)}</td></tr>`
}

function render(s){
  repo = s.repo || ''
  document.getElementById('meta').textContent = `updated ${new Date(s.at).toLocaleTimeString()}`
  holdBanner(s.hold)
  document.getElementById('headline').innerHTML = headline(s.board, s.launch)
  const td = s.launch?.today
  document.getElementById('today').innerHTML = todayLine(td
    ? { merged: td.merged, done: td.done, made: td.added, delta: td.done - td.added } : s.board?.today)
  document.getElementById('buildinghead').textContent = s.live.length ? `Building now · ${s.live.length}` : 'Building now'
  document.getElementById('building').innerHTML = s.live.length
    ? `<div class="rows">${s.live.map(buildRow).join('')}</div>` : '<p class="empty">Nothing is being built.</p>'
  document.getElementById('needshead').textContent = s.board?.needsYou?.length ? `Needs you · ${s.board.needsYou.length}` : 'Needs you'
  document.getElementById('needs').innerHTML = needsList(s.board)
  // Collapsed to its counts: the rows are there for whoever opens it.
  document.getElementById('donehead').innerHTML = `Finished recently${s.done.length ? ` <span>· ${esc(String(s.doneSummary || '').replace(/^Finished: ?/, ''))}</span>` : ''}`
  document.getElementById('done').innerHTML = s.done.length ? s.done.map(doneRow).join('') : '<tr><td class="empty">Nothing yet.</td></tr>'
  document.getElementById('machine').innerHTML = machineLine(s)
}
async function tick(){
  try{
    const r = await fetch('/api/agents', {cache:'no-store'})
    render(await r.json())
  }catch(e){ document.getElementById('meta').textContent = 'Lost contact with the live view — is it still running?' }
}
tick(); setInterval(tick, 5000)
</script>
</body>
</html>
