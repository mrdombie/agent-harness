<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinator, live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* 16-bit: menu windows of a console role-playing game, one palette, square corners,
   stepped shadows. Pixel face for labels and figures; a readable pixel face for titles. */
:root{
  --night:#0b0d24; --night2:#141a3c;
  --win:#1b2a8a; --win2:#0d1660; --winedge:#e8ecff; --winmid:#7b86d6; --windark:#050826;
  --ink:#f4f6ff; --ink2:#c3c9f0; --ink3:#8d95c9;
  --gold:#ffd23f; --good:#4fe36b; --warn:#ffa82e; --bad:#ff4d5e; --cyan:#5fe0ff; --pink:#ff7ad9;
  --px:'Press Start 2P',ui-monospace,monospace; --rd:'Pixelify Sans',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;color:var(--ink);font:18px/1.35 var(--rd);padding-inline:16px;min-height:100vh;
  background:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
    radial-gradient(1px 1px at 68% 9%,#fff6 50%,transparent 51%),
    radial-gradient(2px 2px at 84% 34%,#fff5 50%,transparent 51%),
    radial-gradient(1px 1px at 33% 61%,#fff5 50%,transparent 51%),
    radial-gradient(1px 1px at 91% 77%,#fff6 50%,transparent 51%),
    radial-gradient(2px 2px at 7% 88%,#fff4 50%,transparent 51%),
    linear-gradient(180deg,var(--night) 0%,var(--night2) 100%) fixed;
  -webkit-font-smoothing:none;image-rendering:pixelated}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0000001f 2px 3px);z-index:9}
a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.page{max-width:1360px;margin:0 auto;padding-block:18px 48px}

/* the window: the one container on the page */
.win{position:relative;background:linear-gradient(180deg,var(--win) 0%,var(--win2) 100%);
  border:3px solid var(--winedge);box-shadow:0 0 0 3px var(--windark),inset 0 0 0 3px var(--winmid),6px 6px 0 3px #00000080;
  padding:18px 16px 14px;margin:0 0 22px}
.win>h2,.win>details>summary.wh{position:absolute;top:-14px;left:12px;margin:0;background:var(--windark);border:3px solid var(--winedge);
  padding:5px 9px;font:10px/1 var(--px);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.win.red{background:linear-gradient(180deg,#8a1b2c 0%,#4a0a18 100%)}
.win.red>h2{color:#fff}
.win.dim{background:linear-gradient(180deg,#232a5a 0%,#141936 100%)}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:6px 0 26px}
.logo{display:flex;align-items:center;gap:12px}
h1{font:16px/1.3 var(--px);margin:0;color:var(--gold);text-shadow:3px 3px 0 #b5361a,6px 6px 0 #000}
.meta{color:var(--ink3);font:10px/1.6 var(--px)}
.meta.stale{color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}

/* the HUD: five figures across the top */
.hud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:26px}
.stat{background:linear-gradient(180deg,var(--win) 0%,var(--win2) 100%);border:3px solid var(--winedge);
  box-shadow:0 0 0 3px var(--windark),inset 0 0 0 3px var(--winmid),5px 5px 0 3px #00000080;padding:12px 12px 10px;min-width:0}
.stat .k{display:block;font:9px/1.4 var(--px);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.stat b{display:block;font:22px/1.3 var(--px);color:var(--ink);margin-top:8px;white-space:nowrap}
.stat b small{font-size:11px;color:var(--ink3)}
.stat .s{display:block;font-size:15px;color:var(--ink3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.go b{color:var(--good)} .stat.alert b{color:var(--bad)} .stat.gold b{color:var(--gold)} .stat.cool b{color:var(--cyan)}

.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:0 26px;align-items:start}
.col{min-width:0}

/* the hold: a flashing warning window */
.banner{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(180deg,#a3122a,#5a0716);border:3px solid #fff;
  box-shadow:0 0 0 3px var(--windark),inset 0 0 0 3px #ff8a97,6px 6px 0 3px #00000080;padding:14px 16px;margin:0 0 26px}
.banner[hidden]{display:none}
.banner .dot{width:22px;height:22px;flex:none;background:var(--gold);margin-top:2px;
  clip-path:polygon(40% 0,60% 0,60% 60%,40% 60%,40% 0,40% 75%,60% 75%,60% 100%,40% 100%);animation:blink 1s steps(2) infinite}
.banner b{display:block;font:12px/1.6 var(--px);color:#fff}
.banner span{display:block;color:#ffe3e7;font-size:17px;margin-top:4px}
#processfirst{font:10px/1.6 var(--px);color:var(--gold);margin:-14px 0 22px}
#processfirst[hidden]{display:none}

/* rows */
.rows{display:flex;flex-direction:column;gap:0}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-top:2px dashed #ffffff26;min-width:0}
.row:first-child{border-top:0;padding-top:2px}
.row .main{min-width:0;flex:1}
.title{font-weight:600;line-height:1.25;color:var(--ink)}
.row .title{font-size:19px;overflow-wrap:anywhere}
.sub{color:var(--ink3);font-size:16px}
.sub a{color:var(--cyan)}
.row .line{color:var(--ink2);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.row .step{font-size:16px;color:var(--ink2);margin-top:3px}
.row .step b{color:var(--gold);font-weight:600}
.row .pos{min-width:30px;font:11px/1.9 var(--px);color:var(--gold)}
.tag{display:inline-block;font:9px/1 var(--px);color:var(--night);background:var(--cyan);padding:4px 5px 3px;margin-right:4px;vertical-align:3px;text-transform:uppercase}
.empty{color:var(--ink3);margin:2px 0}

/* building: a party member per builder */
.row.build{padding:12px 4px}
.sprite{flex:none;width:40px;height:40px;margin-top:2px;animation:bob 1s steps(2) infinite}
.sprite.slow{animation-duration:2s;filter:saturate(.6)}
.sprite.stuck{animation:none;filter:grayscale(1) brightness(.8)}
.sprite.away{animation:none;opacity:.45}
@keyframes bob{50%{transform:translateY(-3px)}}
.dot{width:12px;height:12px;flex:none;margin-top:6px;background:var(--ink3)}
.dot.ok{background:var(--good)} .dot.slow{background:var(--warn)} .dot.stuck{background:var(--bad)}
.dot.away{background:transparent;border:3px solid var(--ink3)}
.pips{display:flex;gap:3px;margin-top:7px}
.pips i{flex:1;max-width:44px;height:10px;background:#000a;border:2px solid #ffffff40}
.pips i.done{background:var(--good);border-color:#b8ffc5}
.pips i.now{background:var(--gold);border-color:#fff3b0;animation:blink 1s steps(2) infinite}
.row.next .step{font-size:15px}
.row.next .pf{color:var(--pink)}

/* the coordinator's log */
.feed{list-style:none;margin:0;padding:0;max-height:430px;overflow:auto;scrollbar-color:var(--winmid) transparent}
.feed li{display:grid;grid-template-columns:62px 20px minmax(0,1fr);gap:6px;padding:5px 0;border-top:2px dashed #ffffff1c;font-size:16px;line-height:1.3}
.feed li:first-child{border-top:0}
.feed .t{font:9px/2 var(--px);color:var(--ink3)}
.feed .ic{font-family:var(--px);font-size:11px;line-height:1.8;text-align:center}
.feed .x{color:var(--ink2);overflow-wrap:anywhere}
.feed .start .ic{color:var(--good)} .feed .done .ic{color:var(--cyan)} .feed .requeue .ic{color:var(--warn)}
.feed .stopped .ic,.feed .red .ic{color:var(--bad)} .feed .signoff .ic{color:var(--pink)} .feed .held .ic,.feed .event .ic{color:var(--ink3)}
.feed .held .x{color:var(--ink3)}
.feed .start .x,.feed .done .x{color:var(--ink)}

/* the release: an experience bar */
.ptitle{font:9px/1.6 var(--px);color:var(--ink2);text-transform:uppercase;margin-bottom:8px}
.big{font:20px/1.4 var(--px);color:var(--ink)}
.big small{font-size:11px;color:var(--ink3)}
.progress{margin:10px 0 12px}
.bar{height:24px;background:#000;border:3px solid var(--winedge);box-shadow:inset 0 0 0 2px #000;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--good) 0 14px,#2fb24a 14px 16px);box-shadow:inset 0 4px 0 #b8ffc5,inset 0 -4px 0 #1d7a31}
.pline{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin-top:8px;font-size:17px;color:var(--ink2)}
.pline b{color:var(--gold);font-weight:600}
.pace.ok{color:var(--good)} .pace.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;gap:6px;align-items:baseline;background:var(--windark);border:2px solid var(--winmid);padding:4px 9px;font-size:16px;color:var(--ink2);white-space:nowrap}
.chip b{color:var(--gold);font-family:var(--px);font-size:10px;font-weight:400}
.chip.zero{opacity:.45}
.chip.muted{background:transparent;color:var(--ink3);border-style:dashed}
.outside{margin-top:6px}
.week{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
.days{display:flex;gap:8px;align-items:flex-end;height:76px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;width:30px}
.pair{display:flex;gap:3px;align-items:flex-end;height:56px}
.pair i{display:block;width:11px;min-height:2px}
.pair i.add{background:var(--ink3)} .pair i.done{background:var(--good)}
.day span{font:8px/1 var(--px);color:var(--ink3)}
.day.today span{color:var(--gold)}
.legend{font-size:15px;color:var(--ink3);display:flex;flex-direction:column;gap:3px}
.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}
.spark{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--ink3)}
.spark svg{color:var(--gold);shape-rendering:crispEdges}

.today{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;font-size:18px;color:var(--ink2)}
.today b{font:16px/1 var(--px);color:var(--ink)}
.delta{font-weight:600}
.delta.ok{color:var(--good)} .delta.bad{color:var(--bad)} .delta.neutral{color:var(--ink3)}
.measures{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 22px;margin-top:8px}
.measures .fig{min-width:0}
.measures .k{display:block;color:var(--ink3);font-size:15px}
.measures b{font:14px/1.6 var(--px);color:var(--ink)}
.measures b small{font-size:9px;color:var(--ink3)}
.measures .base{display:block;color:var(--ink3);font-size:14px}
.proxies{margin:6px 0 0;padding-left:20px;color:var(--ink2);font-size:16px}
.allclear{color:var(--good);font:11px/1.6 var(--px)}

details summary{cursor:pointer;color:var(--cyan);font-size:16px;margin-top:6px}
details.fold>summary{list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary.wh{cursor:pointer}
details.fold>summary::before{content:'▶ '}
details.fold[open]>summary::before{content:'▼ '}
details.fold>summary span{color:var(--ink2);text-transform:none}
.foldbody{padding-top:4px}
table{width:100%;border-collapse:collapse}
td{padding:9px 8px;border-top:2px dashed #ffffff26;font-size:16px;vertical-align:top}
tr:first-child td{border-top:0}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:3px 6px 2px;font:8px/1.4 var(--px);white-space:nowrap;text-transform:uppercase;color:var(--night)}
.pill.ok{background:var(--good)} .pill.warn{background:var(--warn)} .pill.bad{background:var(--bad);color:#fff} .pill.neutral{background:var(--ink3)}
.ran{color:var(--ink3);font-size:15px;margin-top:3px}
.num{white-space:nowrap;color:var(--ink2)}
.note{color:var(--ink2);font-size:15px;margin-top:3px;overflow-wrap:anywhere}
.note.muted{color:var(--ink3)}
.said{color:var(--ink2);font-size:15px;border-left:3px solid var(--winmid);padding-left:9px}
.scope{color:var(--ink3);font-size:14px;white-space:nowrap}

footer{color:var(--ink3);font-size:15px;line-height:1.7}
.disklow{color:var(--bad);font-weight:600} .diskheld{color:var(--warn);font-weight:600} .behind{color:var(--warn);font-weight:600}

@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}.hud{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){
  body{font-size:17px}
  .hud{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .stat b{font-size:16px}
  h1{font-size:12px}
  .win{padding:18px 12px 12px}
  .feed li{grid-template-columns:54px 18px minmax(0,1fr)}
  .sprite{width:32px;height:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="page">
  <header><div class="logo"><svg class="sprite" id="logo" viewBox="0 0 12 12" width="36" height="36" aria-hidden="true"></svg><h1>Coordinator, live</h1></div><span class="meta" id="meta">loading…</span></header>
  <div class="hud" id="hud"></div>
  <div class="banner" id="hold" role="status" hidden></div>
  <p class="sub" id="processfirst" hidden></p>
  <div class="grid">
    <div class="col">
      <section class="win"><h2 id="buildinghead">Building now</h2><div id="building"></div></section>
      <section class="win"><h2 id="nexthead">Coming up next</h2><div id="next"></div></section>
    </div>
    <div class="col">
      <section class="win red" id="needswin"><h2 id="needshead">Needs you</h2><div id="needs"></div></section>
      <section class="win dim"><h2 id="feedhead">What the coordinator did</h2><div id="feed"></div></section>
      <section class="win"><h2 id="mergedhead">Merged today</h2><div id="merged"></div></section>
    </div>
  </div>
  <section class="win headline" id="headline"><div class="ptitle">Release progress</div><div class="big">Release: counting…</div></section>
  <section class="win"><h2>Today</h2><div class="today" id="today"><span class="empty">Not read yet.</span></div></section>
  <section class="win"><h2 id="measureshead">How the build is doing</h2><div id="measures"><p class="empty">Not measured yet.</p></div></section>
  <section class="win dim"><details class="fold" id="donefold"><summary class="wh" id="donehead">Finished recently</summary>
    <div class="tablewrap foldbody"><table id="done"></table></div></details></section>
  <section class="win dim"><h2>Machine</h2><footer id="machine">Machine: not read yet.</footer></section>
</div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const ago = (sec) => sec == null ? '—' : sec < 60 ? `${sec}s ago` : sec < 3600 ? `${Math.round(sec/60)} min ago` : `${Math.round(sec/3600)} h ago`
const dur = (min) => min < 60 ? `${min} min` : `${Math.floor(min/60)} h ${min%60} min`
let repo = ''
// An instant the reader can act on: "Tue 20 Oct, 20:00". A bare reset wording
// ("7:20pm") is shown as it was written.
const when = (u) => {
  const d = /^\d{4}-\d{2}-\d{2}T/.test(u || '') ? new Date(u) : null
  if (!d || isNaN(d)) return u || ''
  return d.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
}
function holdBanner(h){
  const el = document.getElementById('hold')
  if (!h || !h.held) { el.hidden = true; el.innerHTML = ''; return }
  const head = h.kind === 'usage'
    ? `Not starting new work: ${esc(h.reason || 'the usage limit was reached')}`
    : h.allows === 'process' ? `Not starting new work except process fixes: paused by the owner`
    : `Not starting new work: paused by the owner`
  const sub = h.kind === 'usage'
    ? (h.until ? `Starts again ${esc(when(h.until))}. ` : '')
      + (h.rechecked ? `Last re-checked ${esc(when(h.rechecked))}: ${esc(h.recheck || 'still at the limit')}. ` : '')
      + 'Work already running carries on.'
    : `${esc(h.reason || '')}${h.reason ? '. ' : ''}Work already running carries on.`
  el.innerHTML = `<span class="dot"></span><div><b>${head}</b><span>${sub}</span></div>`
  el.hidden = false
}

// One plain row per builder: what it is, how far along, how long, what it last did.
const STEP_WORD = { 'Set up': 'Setting up', Plan: 'Planning', Build: 'Building', Check: 'Checking',
  Review: 'Being reviewed', PR: 'Opening the pull request', Merged: 'Merging',
  'Back on the PR': 'Going back to the pull request', Repair: 'Repairing', Fix: 'Fixing', Record: 'Recording', Push: 'Pushing the fix' }
// The step as the record that knows it names it: the driver's state, else the claim's step.
function stepText(a){
  const p = a.progress
  if (a.stepFrom === 'claim' || (!a.stepFrom && a.claimStep)) return `<b>${esc(CLAIM_WORD[a.claimStep] || a.claimStep)}</b>`
  if (!a.stepFrom || !p || !p.of) return (a.startedAgoMin ?? 0) < 5 ? '<b>Starting</b>' : '<b>Step not reported yet</b>'
  const name = (p.steps || [])[p.step - 1]?.name || ''
  return `${esc(p.step)} of ${esc(p.of)} · <b>${esc(STEP_WORD[name] || name)}</b>`
}
// The work's name from its title scope ("Holly"), in front of the title on building and next rows.
const tagOf = (r) => r && r.tag ? `<span class="tag">${esc(r.tag)}</span> ` : ''
const ticketLink = (n, kind = 'issues') => repo
  ? `<a href="https://github.com/${esc(repo)}/${kind}/${esc(n)}" target="_blank" rel="noopener">#${esc(n)}</a>` : `#${esc(n)}`
// The machine a row runs on, in plain words. thisHost comes from the snapshot.
let thisHost = ''
const machineOf = (h) => !h ? 'Machine not recorded' : h === thisHost ? `This machine (${esc(h)})` : `On ${esc(h)}`
// Another machine's claim: its step as the claim names it; progress and activity
// stay in logs on that machine, so they are left out, never invented.
const CLAIM_WORD = { start: 'Setting up', plan: 'Planning', build: 'Building', 'self-check': 'Checking', review: 'Being reviewed',
  size: 'Sizing the change', quick: 'Making the quick change',
  ship: 'Opening the pull request', fix: 'Fixing', push: 'Pushing the fix',
  'usage-hold': 'Waiting for usage to reset' }
// Another machine's run, from its heartbeat: coloured like a local row while the
// heartbeat is fresh; the grey ring only when the machine itself has stopped reporting.
const quietCls = (q) => q < 90 ? 'ok' : q < 600 ? 'slow' : 'stuck'
function remoteRow(a){
  const step = a.claimStep ? `<b>${esc(CLAIM_WORD[a.claimStep] || a.claimStep)}</b>` : ''
  const time = a.startedAgoMin != null ? `claimed ${esc(dur(a.startedAgoMin))} ago` : ''
  const away = a.beatStale !== false
  // A fresh heartbeat that names no activity for this run (an older harness there) is not a stuck run.
  const cls = away || a.quietSec == null ? 'away' : quietCls(a.quietSec)
  const last = a.steps?.length ? a.steps[a.steps.length - 1].text : ''
  const line = a.beatStale === true ? `${esc(a.host)} not reporting since ${esc(a.beatTime || 'its last heartbeat')}`
    : away ? `No heartbeat from ${esc(a.host)} on record`
    : a.quietSec == null ? `${esc(a.host)} reports no activity for this run yet`
    : last ? esc(last) : 'No activity reported yet'
  const tip = cls === 'away' ? 'no activity reported from its machine' : `last active ${ago(a.quietSec)}`
  return `<div class="row build remote"><span class="dot ${cls}" title="${esc(tip)}"></span><div class="main">
    <div class="title">${tagOf(a)}${esc(a.short || a.title)} <span class="sub">${ticketLink(a.ticket)}</span></div>
    <div class="step">${[machineOf(a.host), step, time].filter(Boolean).join(' · ')}</div>
    <div class="line">${line}</div></div></div>`
}
// The route the driver chose for the run: a quick change or a full build.
const routeText = (a) => a.route === 'quick' ? 'Quick change · ' : a.route === 'full' ? 'Full build · ' : ''
// A builder drawn as a 12×12 sprite: hard hat, face, a body in its status colour, a hammer.
const SPRITE = ['....HHHH....','...HHHHHH...','..HHHHHHHH..','...FFFFFF...','...FEFFEF...','...FFFFFF...',
  '....BBBB...T','..BBBBBBB.TT','.ABBBBBBBA.T','..BBBBBBB...','...LL..LL...','...LL..LL...']
const BODY = { ok: '#4fe36b', slow: '#ffa82e', stuck: '#ff4d5e', away: '#8d95c9' }
function sprite(cls){
  const fill = { H: '#ffd23f', F: '#ffd9b0', E: '#0b0d24', B: BODY[cls] || BODY.away, A: '#ffd9b0', L: '#1b2a8a', T: '#c3c9f0' }
  const px = SPRITE.flatMap((r, y) => [...r].map((c, x) => fill[c] ? `<rect x="${x}" y="${y}" width="1" height="1" fill="${fill[c]}"/>` : '')).join('')
  return `<svg class="sprite ${cls}" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">${px}</svg>`
}
// The run's steps as pips: done, the one it is on, the ones to come.
function pips(p){
  if (!p || !p.of || !(p.steps || []).length) return ''
  return `<div class="pips" aria-hidden="true">${p.steps.map((st, i) => `<i class="${i + 1 < p.step ? 'done' : i + 1 === p.step ? 'now' : ''}" title="${esc(st.name)}"></i>`).join('')}</div>`
}
// A build started here by hand, outside the queue: it holds a place, and its steps live in its own log.
function outsideRow(a){
  return `<div class="row build outside"><span title="started outside the queue">${sprite('away')}</span><div class="main">
    <div class="title">${tagOf(a)}${esc(a.short || a.title)} <span class="sub">${ticketLink(a.ticket)}</span></div>
    <div class="step">${machineOf(a.host)} · <b>Started outside the queue</b></div>
    <div class="line">Run by hand, so the coordinator counts its place but does not report its steps</div></div></div>`
}
function buildRow(a){
  if (a.outside) return outsideRow(a)
  if (a.remote) return remoteRow(a)
  const cls = quietCls(a.quietSec ?? 99999)
  const last = a.steps?.length ? a.steps[a.steps.length - 1].text : 'No activity yet'
  return `<div class="row build"><span title="last active ${esc(ago(a.quietSec))}">${sprite(cls)}</span><div class="main">
    <div class="title">${tagOf(a)}${esc(a.short || a.title)} <span class="sub">${ticketLink(a.ticket)}</span></div>
    <div class="step">${machineOf(a.host)} · ${routeText(a)}${stepText(a)} · ${esc(dur(a.startedAgoMin))} running</div>
    <div class="line" title="${esc(last)}">${esc(last)}</div>${a.stepFrom === 'driver' || (!a.stepFrom && !a.claimStep) ? pips(a.progress) : ''}</div></div>`
}
const num = (n) => Number(n).toLocaleString()
const DAY = (d) => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd) }
const dayName = (d) => DAY(d).toLocaleDateString(undefined, { weekday: 'short' })
const dateName = (d) => DAY(d).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })
function spark(vals){
  const w = 120, h = 28, max = Math.max(1, ...vals)
  const pts = vals.map((v, i) => `${(i * w / Math.max(1, vals.length - 1)).toFixed(1)},${(h - 2 - v * (h - 4) / max).toFixed(1)}`).join(' ')
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`
}
// The release: every release ticket done since the start date plus every one still
// open, as the big number, then the bar of done against it.
// What was left out of it and why, so the number can be checked against the board.
function outsideLine(b){
  const o = b?.outside
  if (!o) return ''
  const pri = (b.lowerPriorities || []).map(p => p === 'none' ? 'no priority' : p).join('/')
  const parts = [[o.lower, `lower-priority${pri ? ` (${esc(pri)})` : ''}`], [o.post, 'post-launch'],
    [(o.batch || 0) + (o.epic || 0), 'wrappers'], [o.parked, 'parked']]
    .filter(([n]) => n).map(([n, w]) => `${num(n)} ${w}`)
  return parts.length ? `<div class="sub outside">Outside the release: ${parts.join(' · ')}</div>` : ''
}
// The left side, split as the coordinator splits it: product first, our own tooling after.
const splitLine = (l) => l && Number.isInteger(l.product) && Number.isInteger(l.tooling)
  ? `<div class="pline split"><span>Left: Product <b>${num(l.product)}</b> · Our tooling <b>${num(l.tooling)}</b></span></div>` : ''
function releaseTop(l, b){
  if (!l) return '<div class="ptitle">Release progress</div><div class="big">Release: counting…</div>'
    + '<div class="sub">The release total lands with the next count.</div>' + outsideLine(b)
  return `<div class="ptitle">Release progress</div><div class="big">Release: ${num(l.total)} <small>tickets</small></div>
    <div class="progress"><div class="bar" role="img" aria-label="${esc(l.pct)}% done"><i style="width:${Math.min(100, l.pct)}%"></i></div>
    <div class="pline"><span><b>${num(l.done)}</b> done · <b>${num(l.open)}</b> left · <b>${esc(l.pct)}%</b></span><span class="sub">counted since ${esc(dateName(l.base))}</span></div>${splitLine(l)}</div>${outsideLine(b)}`
}
// Added against done for each of the last seven days and today, with the pace and where it lands.
function paceBlock(l){
  if (!l) return ''
  const pace = l.burn == null ? '' : l.converging
    ? `<span class="pace ok">Shrinking ${num(l.burn)}/day</span><span>At this pace: <b>${esc(dateName(l.eta))}</b></span>`
    : `<span class="pace bad">Not converging: +${num(Math.abs(l.burn))}/day</span>`
  const max = Math.max(1, ...l.days.map(d => Math.max(d.added, d.done)))
  const hgt = (n) => `${Math.round(n * 48 / max)}px`
  const days = l.days.map((d, i) => `<div class="day${i === l.days.length - 1 ? ' today' : ''}" title="${esc(d.day)}: ${d.added} added, ${d.done} done, ${d.merged} merged">
    <div class="pair"><i class="add" style="height:${hgt(d.added)}"></i><i class="done" style="height:${hgt(d.done)}"></i></div>
    <span>${i === l.days.length - 1 ? 'Today' : esc(dayName(d.day))}</span></div>`).join('')
  return `<div class="ptitle" style="margin-top:16px">Added and done, per day</div>
    <div class="week"><div class="days">${days}</div>
      <div class="legend"><span><i style="background:var(--ink3);opacity:.55"></i>added</span><span><i style="background:var(--good)"></i>done</span></div></div>
    <div class="pline">${pace}</div>`
}
function mergedBlock(l){
  if (!l) return ''
  const merged = l.days.map(d => d.merged)
  return `<div class="ptitle" style="margin-top:16px">Pull requests merged, per day</div>
    <div class="spark">${spark(merged)}<span>${num(merged.slice(0, -1).reduce((a, b) => a + b, 0))} in the last seven days · ${num(merged[merged.length - 1])} today</span></div>`
}
function headline(b, l){
  if (!b) return releaseTop(null, null)
  const chips = b.buckets.map(c => `<span class="chip${c.n ? '' : ' zero'}" data-k="${esc(c.key)}"><b>${num(c.n)}</b> ${esc(c.label)}</span>`)
  return `${releaseTop(l, b)}<div class="chips">${chips.join('')}</div>${paceBlock(l)}${mergedBlock(l)}`
}
function todayLine(t){
  if (!t) return '<span class="empty">Today’s counts land with the next full count.</span>'
  const v = (n) => n == null ? '—' : num(n)
  const d = t.delta
  const delta = d == null ? '' : d > 0 ? `<span class="delta ok">List shrinking by ${num(d)}</span>`
    : d < 0 ? `<span class="delta bad">List growing by ${num(-d)}</span>` : '<span class="delta neutral">List holding steady</span>'
  return `<span><b>${v(t.merged)}</b> merged</span><span><b>${v(t.done)}</b> done</span><span><b>${v(t.made)}</b> new</span>${delta}`
}
// The figures the build is judged by (scripts/build-measures.sh): the newest day beside the
// frozen baseline, and under them what each figure actually counts.
const MEASURE_FIGS = [
  ['merged', 'Merged', (r) => fig(r.merged?.n)],
  ['reverted', 'Reverted', (r) => share(r.reverted?.share)],
  ['reviewsToPass', 'Reviews to pass', (r) => `${fig(r.reviewsToPass?.mean)} <small>· 5+ ${share(r.reviewsToPass?.fivePlusShare)}</small>`],
  ['waitHours', 'Open to merge', (r) => `${fig(r.waitHours?.median, 'h')} <small>· p75 ${fig(r.waitHours?.p75, 'h')}</small>`],
  ['featureLeadHours', 'Feature lead time', (r) => `${fig(r.featureLeadHours?.median, 'h')} <small>· p75 ${fig(r.featureLeadHours?.p75, 'h')}</small>`],
  ['findingTickets', 'Finding tickets filed', (r) => fig(r.findingTickets?.n)],
  ['findingsPerRun', 'Findings sent back per run', (r) => fig(r.findingsPerRun?.mean)],
  ['approvalsPerPr', 'Approvals per PR', (r) => fig(r.approvalsPerPr?.mean)],
  ['incidents', 'Incidents', (r) => r.incidents?.n == null ? 'not measured' : fig(r.incidents.n)],
]
const fig = (x, unit = '') => x == null ? '—' : `${num(x)}${unit}`
const share = (x) => x == null ? '—' : `${Math.round(x * 1000) / 10}%`
function measuresBlock(m){
  if (!m || !m.latest) return '<p class="empty">Not measured yet: the first row lands within the hour.</p>'
  const r = m.latest, b = m.baseline && m.baseline.day !== r.day ? m.baseline : null
  const figs = MEASURE_FIGS.map(([k, label, show]) => `<div class="fig" title="${esc(r[k]?.proxy || '')}"><span class="k">${esc(label)}</span><b>${show(r)}</b>${
    b ? `<span class="base">baseline ${show(b).replace(/<[^>]+>/g, '')}</span>` : ''}</div>`).join('')
  const proxies = MEASURE_FIGS.filter(([k]) => r[k]?.proxy).map(([k, label]) => `<li><b>${esc(label)}</b> counts ${esc(r[k].proxy)}</li>`).join('')
  return `<p class="sub">${esc(dateName(r.day))}${r.complete ? '' : ', so far'}${b ? ` · baseline ${esc(dateName(b.day))}` : ''}</p>
    <div class="measures">${figs}</div>
    <details class="fold"><summary>What each figure counts</summary><ul class="proxies">${proxies}</ul></details>`
}
const NEEDS_SHOWN = 8
function needsList(b){
  if (!b) return '<p class="empty">Not read yet.</p>'
  if (!b.needsYou.length) return '<div class="allclear">Nothing needs you</div>'
  const row = (n) => `<div class="row need"><div class="main"><div class="title">${esc(n.title)}</div>
    <div class="sub">${esc(n.why)} · ${n.kind === 'pr' ? `pull request ${ticketLink(n.number, 'pull')}` : ticketLink(n.number)}</div></div></div>`
  const head = b.needsYou.slice(0, NEEDS_SHOWN).map(row).join('')
  const rest = b.needsYou.slice(NEEDS_SHOWN)
  return `<div class="rows">${head}</div>` + (rest.length
    ? `<details><summary>${rest.length} more</summary><div class="rows" style="margin-top:6px">${rest.map(row).join('')}</div></details>` : '')
}
function machineLine(s){
  const c = s.capacity, parts = []
  const bs = (n) => `${n} builder${n === 1 ? '' : 's'}`
  parts.push(c && c.ceiling != null ? `${s.live.length} of ${bs(c.ceiling)} running` : `${bs(s.live.length)} running`)
  const r = String(c?.reading || '')
  const cpu = /cpu idle (\d+)%/.exec(r), mem = /(\d+(?:\.\d+)?) GB free/.exec(r)
  if (cpu) parts.push(`CPU ${100 - Number(cpu[1])}% busy`)
  if (mem) parts.push(`${mem[1]} GB memory free`)
  const d = s.disk
  if (d && d.freeGb != null) {
    const fr = `${esc(d.freeGb)} GB disk free${d.where ? ' ' + esc(d.where) : ''}`
    parts.push(d.low ? `<span class="disklow">${fr} — under ${esc(d.stopBelowGb)} GB, nothing new starts</span>`
      : d.held ? `<span class="diskheld">${fr} — starts resume at ${esc(d.resumeAtGb)} GB</span>`
      : fr)
  } else if (d) parts.push('disk free not read')
  // No five-hour line: Claude dropped that limit (2026-10-31). A pacer reading still shows below.
  const p = c && c.pace
  // Pacing to the five-hour window, the week only with coordinator.paceToWindow.week: ahead, only process fixes start.
  if (p && (p.fiveHour || p.week)) {
    const ws = [p.fiveHour && ['5h', p.fiveHour], p.week && ['week', p.week]].filter(Boolean)
      .sort((a, b) => (b[1].ahead ? 1 : 0) - (a[1].ahead ? 1 : 0))
      .map(([n, w]) => `${n} ${esc(Math.round(w.u * 100))}% used against a target of ${esc(Math.round(w.line * 100))}%`)
    const ahead = p.pacing === 'ahead'
    const said = `pacing: ${ahead ? 'ahead' : 'behind'} — ${ws.join('; ')}`
    const ex = (p.settings && p.settings.exempt || []).join('/')
    parts.push(ahead ? `<span class="diskheld">${said}: no new builder starts but process fixes${ex ? ' and ' + esc(ex) : ''}</span>` : `${said}: places fill`)
  }
  // The tooling cap (coordinator.toolingCap): harness and process runs on every machine together.
  const tl = c && c.tooling
  if (tl) parts.push(`tooling ${esc(tl.live)} / cap ${esc(tl.cap)}` + (tl.waiting ? `, ${esc(tl.waiting)} waiting` : ''))
  // The open-work cap (coordinator.openPrCap): over it, only quick new tickets start until changes land.
  const op = c && c.openPrs
  if (op && op.cap) parts.push(op.over ? `<span class="diskheld">open changes ${esc(op.count)} / cap ${esc(op.cap)}: finishing before starting</span>`
    : `open changes ${esc(op.count)} / cap ${esc(op.cap)}`)
  if (c && c.usageHold) parts.push(`<span class="disklow">usage hold at ${esc(c.usageHold.pct)}%: running builds wait before their next step</span>`)
  const hosts = (s.hosts || []).map(h => `${esc(h.host)} (${esc(h.n)})`).join(', ')
  return `Machine: ${parts.join(' · ')}<br>Building on: ${hosts || 'no host'} · updated ${esc(new Date(s.at).toLocaleTimeString())}` + fleetLines(s.fleet)
}
// One line per machine from the heartbeats on the shared sheet; "behind" under its version floor.
function fleetLines(f){
  if (!f || !Array.isArray(f.hosts) || !f.hosts.length) return ''
  const line = (h) => [
    `${esc(h.host)}: harness ${esc(h.version || '?')}` + (h.behind ? ` <span class="behind">behind — starts nothing new until it updates to ${esc(f.minHarness)}</span>` : ''),
    h.freeGb == null ? 'disk not read' : `${esc(h.freeGb)} GB disk free`,
    `${esc(h.builds)} building`,
    h.tickAgoMin == null ? 'no tick on record' : h.tickAgoMin < 1 ? 'last tick just now' : `last tick ${esc(dur(h.tickAgoMin))} ago`,
  ].join(' · ')
  return `<br>Machines${f.minHarness ? ` (harness floor ${esc(f.minHarness)})` : ''}:` + f.hosts.map((h) => `<br>${line(h)}`).join('')
}

// Where the ticket stands now, read from GitHub, not how its last run ended: a run
// that handed off a pull request is not a ticket that merged.
const TONES = { ok: 'ok', warn: 'warn', bad: 'bad', neutral: 'neutral' }
const prLink = (n) => repo && n ? `<a href="https://github.com/${esc(repo)}/pull/${esc(n)}" target="_blank" rel="noopener">PR #${esc(n)}</a>` : ''
function nowPill(d){
  const n = d.now || { text: d.exit === 0 ? 'Run ended' : 'Stopped', tone: d.exit === 0 ? 'neutral' : 'bad' }
  const pr = prLink(d.pr || n.pr)
  const detail = n.detail ? `<div class="note">${esc(n.detail)}</div>` : ''
  // Report-only checks that failed: beside the state, muted, never the state.
  const notes = (n.notes || []).length ? `<div class="note muted">notes: ${esc(n.notes.join(', '))}</div>` : ''
  return `<span class="pill ${TONES[n.tone] || 'neutral'}">${esc(n.text)}</span>${pr ? `<div class="note">${pr}</div>` : ''}${detail}${notes}`
}
function ranOut(d){
  if (d.lastRun === 'out-of-budget') return 'Last run ran out of budget'
  if (d.exit === 0) return 'Last run ended'
  return `Last run ended (exit ${esc(d.exit)})`
}
function doneRow(d){
  const link = repo ? `<a href="https://github.com/${esc(repo)}/issues/${esc(d.ticket)}" target="_blank" rel="noopener">#${esc(d.ticket)}</a>` : `#${esc(d.ticket)}`
  const fin = d.finishedAt ? `finished ${esc(when(d.finishedAt))}` : ago(d.endedAgoMin*60)
  return `<tr>
      <td>${nowPill(d)}</td>
      <td><b>${esc(d.title)}</b> <span class="sub">${link}</span><div class="ran">${ranOut(d)}</div><details><summary>What it reported</summary><div class="said" style="margin-top:6px">${esc(d.summary || 'No report.')}</div></details></td>
      <td class="num">${d.cost != null ? '$'+d.cost.toFixed(0) : '—'}</td>
      <td class="num">${fin}</td></tr>`
}
// Merged today: every pull request merged into the trunk since midnight, with its link and time.
function mergedList(m){
  if (!m) return '<p class="empty">Not read yet.</p>'
  if (!m.items.length) return '<p class="empty">Nothing merged yet today.</p>'
  const row = (i) => `<div class="row merged"><div class="main"><div class="title">${esc(i.title || `Pull request ${i.number}`)}</div>
    <div class="sub">${prLink(i.number)}${i.time ? ` · merged ${esc(i.time)}` : ''}</div></div></div>`
  const more = m.total > m.items.length ? `<p class="sub">${num(m.total - m.items.length)} more not listed</p>` : ''
  return `<div class="rows">${m.items.map(row).join('')}</div>${more}`
}

// Coming up next: the coordinator's queue in the order it starts them, minus what is building now.
const NEXT_SHOW = 12
const NEXT_KIND = { new: 'New' }
function nextList(q, building){
  const busy = new Set(building.map((a) => String(a.ticket)))
  const rows = ((q && q.tickets) || []).filter((r) => !busy.has(String(r.ticket)))
  if (!rows.length) return { n: 0, html: '<p class="empty">Nothing is waiting to start.</p>' }
  const row = (r, i) => `<div class="row next"><span class="pos">${i + 1}</span><div class="main">
    <div class="title">${tagOf(r)}${esc(r.title || `Ticket ${r.ticket}`)} <span class="sub">${ticketLink(r.ticket)}</span></div>
    <div class="step">${r.process ? '<b class="pf">Process fix</b> · ' : ''}${esc(NEXT_KIND[r.class] || r.class)}${r.note ? ` · ${esc(r.note)}` : ''}</div></div></div>`
  const more = rows.length > NEXT_SHOW ? `<p class="sub">${num(rows.length - NEXT_SHOW)} more after these</p>` : ''
  return { n: rows.length, html: `<div class="rows">${rows.slice(0, NEXT_SHOW).map(row).join('')}</div>${more}` }
}
// The coordinator stamps its log with the time of day only: how long ago that was, today.
function clockAgoMin(hms, at){
  const m = /^(\d\d):(\d\d)(?::(\d\d))?$/.exec(hms || '')
  if (!m) return null
  const now = new Date(at), then = new Date(now)
  then.setHours(Number(m[1]), Number(m[2]), Number(m[3] || 0), 0)
  let d = (now - then) / 60000
  if (d < -5) d += 1440
  return Math.max(0, Math.round(d))
}
const SILENT_MIN = 12
function hud(s, building, nx){
  const c = s.capacity || {}
  const lc = s.feed?.lastCheck, lcAgo = clockAgoMin(lc, s.at)
  const silent = lcAgo != null && lcAgo > SILENT_MIN
  const needs = s.board?.needsYou?.length
  const merged = s.mergedToday?.total
  const held = s.hold?.held
  const stat = (cls, k, v, sub) => `<div class="stat ${cls}"><span class="k">${k}</span><b>${v}</b><span class="s">${sub}</span></div>`
  return [
    stat(held ? 'alert' : 'go', 'Building', `${building.length}${c.ceiling != null ? `<small>/${esc(c.ceiling)}</small>` : ''}`,
      held ? 'new starts paused' : c.room ? 'room for more' : 'machine full'),
    stat('gold', 'Up next', num(nx.n), nx.n ? 'in the queue' : 'queue empty'),
    stat('cool', 'Merged today', merged == null ? '—' : num(merged), s.launch?.today ? `${num(s.launch.today.added)} new tickets` : 'pull requests'),
    stat(needs ? 'alert' : 'go', 'Needs you', needs == null ? '—' : num(needs), needs ? 'waiting on a person' : 'all clear'),
    stat(silent ? 'alert' : '', 'Last check', lc ? esc(lc.slice(0, 5)) : '—', lc == null ? 'no log read' : silent ? `silent ${dur(lcAgo)}` : lcAgo < 1 ? 'just now' : `${dur(lcAgo)} ago`),
  ].join('')
}
const FEED_ICON = { start: '▶', done: '★', requeue: '↻', stopped: '✖', red: '▲', signoff: '!', held: '‖', event: '•' }
function feedList(f, titles){
  if (!f) return '<p class="empty">The coordinator\'s log could not be read.</p>'
  if (!f.rows.length) return '<p class="empty">Nothing in the log yet.</p>'
  const named = (r) => {
    const t = r.ticket && titles.get(String(r.ticket))
    return t && (r.kind === 'start' || r.kind === 'done') ? ` <span class="sub">${esc(t)}</span>` : ''
  }
  const link = (x) => esc(x).replace(/#(\d{3,})/g, (_, n) => ticketLink(n))
  return `<ul class="feed">${f.rows.map((r) => `<li class="${esc(r.kind)}"><span class="t">${esc(r.t.slice(0, 5))}</span><span class="ic">${FEED_ICON[r.kind] || '•'}</span><span class="x">${link(r.text)}${named(r)}</span></li>`).join('')}</ul>`
}
let lastSnap = null
function render(s){
  lastSnap = s
  repo = s.repo || ''
  document.getElementById('meta').textContent = `updated ${new Date(s.at).toLocaleTimeString()}`
  holdBanner(s.hold)
  const pf = document.getElementById('processfirst'), np = s.queue?.processFirst || 0
  pf.hidden = !np; pf.textContent = np ? `Process fixes first: ${np}` : ''
  document.getElementById('headline').innerHTML = headline(s.board, s.launch)
  const td = s.launch?.today
  const tl = td ? { merged: td.merged, done: td.done, made: td.added, delta: td.done - td.added } : s.board?.today
  document.getElementById('today').innerHTML = todayLine(tl && s.mergedToday ? { ...tl, merged: s.mergedToday.total } : tl)
  document.getElementById('mergedhead').textContent = s.mergedToday ? `Merged today · ${s.mergedToday.total}` : 'Merged today'
  document.getElementById('merged').innerHTML = mergedList(s.mergedToday)
  document.getElementById('measures').innerHTML = measuresBlock(s.measures)
  thisHost = s.thisHost || ''
  const building = [...s.live, ...(s.elsewhere || [])]
  building.push(...(s.outside || []))
  document.getElementById('buildinghead').textContent = building.length ? `Building now · ${building.length}` : 'Building now'
  document.getElementById('building').innerHTML = building.length
    ? `<div class="rows">${building.map(buildRow).join('')}</div>` : '<p class="empty">Nothing is being built.</p>'
  const nx = nextList(s.queue, building)
  document.getElementById('nexthead').textContent = nx.n ? `Coming up next · ${nx.n}` : 'Coming up next'
  document.getElementById('next').innerHTML = nx.html
  document.getElementById('hud').innerHTML = hud(s, building, nx)
  const titles = new Map()
  for (const r of [...(s.queue?.tickets || []), ...s.done, ...building]) if (r.ticket && (r.short || r.title)) titles.set(String(r.ticket), r.short || r.title)
  document.getElementById('feed').innerHTML = feedList(s.feed, titles)
  const lcAgo = clockAgoMin(s.feed?.lastCheck, s.at)
  const metaEl = document.getElementById('meta')
  metaEl.className = lcAgo != null && lcAgo > SILENT_MIN ? 'meta stale' : 'meta'
  if (lcAgo != null && lcAgo > SILENT_MIN) metaEl.textContent = `Coordinator silent since ${s.feed.lastCheck.slice(0, 5)} · page updated ${new Date(s.at).toLocaleTimeString()}`
  document.getElementById('needshead').textContent = s.board?.needsYou?.length ? `Needs you · ${s.board.needsYou.length}` : 'Needs you'
  document.getElementById('needs').innerHTML = needsList(s.board)
  document.getElementById('needswin').className = s.board?.needsYou?.length ? 'win red' : 'win'
  // Collapsed to its counts: the rows are there for whoever opens it.
  document.getElementById('donehead').innerHTML = `Finished recently${s.done.length ? ` <span>· ${esc(String(s.doneSummary || '').replace(/^Finished: ?/, ''))}</span>` : ''}`
  document.getElementById('done').innerHTML = s.done.length ? s.done.map(doneRow).join('') : '<tr><td class="empty">Nothing yet.</td></tr>'
  document.getElementById('machine').innerHTML = machineLine(s)
}
async function tick(){
  try{
    const r = await fetch('/api/agents', {cache:'no-store'})
    render(await r.json())
  }catch(e){ document.getElementById('meta').textContent = 'Lost contact with the live view — is it still running?' }
}
document.getElementById('logo').innerHTML = sprite('ok').replace(/^<svg[^>]*>|<\/svg>$/g, '')
tick(); setInterval(tick, 5000)
</script>
</body>
</html>
