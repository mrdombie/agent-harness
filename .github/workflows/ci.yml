name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the changed-shell check diffs against the trunk's merge-base
      - name: Manifests parse
        run: |
          jq . .claude-plugin/plugin.json >/dev/null
          jq . .claude-plugin/marketplace.json >/dev/null
          jq . hooks/hooks.json >/dev/null
      - name: Manifest validates against the CLI's own schema
        # JSON that parses is not a manifest the CLI accepts: `"agents": "./agents/"`
        # parsed fine and `claude plugin install` refused it (2026-09-20).
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate .
      - name: Scripts and hooks parse
        run: |
          for f in scripts/*.sh hooks/*.sh hooks/lib/*.sh tests/lib/*.sh swarm/*.sh swarm/tests/*.sh \
                   briefs/*.sh briefs/tests/*.sh \
                   driver/*.sh driver/steps/*.sh driver/tests/*.sh driver/build-ticket \
                   .github/ci/*.sh; do
            bash -n "$f"
          done
      - name: Every suite is reached by a shard
        # A suite CI does not glob is a suite that is not run, and it reports green
        # by never reporting at all — hooks/lib/ was invisible that way once, and
        # swarm/tests/ shipped six suites nothing here could see. The shards run
        # exactly what `.github/ci/shard.sh --all` lists, so a tracked suite it
        # misses fails the build by name.
        # reference/ is excluded and must stay excluded: it holds the copies this
        # plugin replaced, kept verbatim so a reader can see what the live version
        # was reconciled FROM. Nothing loads them and they are not maintained.
        run: |
          missed=$(comm -23 <(git ls-files '*.test.sh' | grep -v '^reference/' | sort) <(bash .github/ci/shard.sh --all | sort))
          if [ -n "$missed" ]; then
            echo "these suites exist and nothing ran them — add their directory to suites() in .github/ci/shard.sh:"
            printf '%s\n' "$missed" | sed 's/^/  /'
            exit 1
          fi
      - name: Every suite proves it reached its end
        # Exit 0 alone cannot prove a suite finished: a cleanup that calls exit turns
        # a crash into 0. Each suite cleans up through on_exit_keep_status and ends on
        # suite_end, whose summary line .github/ci/run-suite.sh requires.
        run: bash scripts/check-suite-ending.sh
      - name: Signals are read from their source
        # A phrase matched in a whole log matches every quote of it too.
        run: bash scripts/check-signal-source.sh
      - name: The kit names no project
        run: bash scripts/check-project-agnostic.sh
      - name: Every picture is checked against the kit before the operator sees it
        run: bash scripts/check-picture-mode.sh
      - name: Every push names its destination
        # A push naming no src:dst follows the upstream, and a worktree cut from a trunk tracks it.
        run: bash scripts/check-push-destination.sh
      - name: Our own skills are addressed with the kit
        # A bare /claim in the kit's own instructions resolves to whichever copy
        # the machine carries. Three were reachable on the origin machine and they
        # disagreed by 474 lines; the one that loaded was never the kit's.
        run: bash scripts/check-skill-namespacing.sh
      - name: No GitHub list goes to jq on argv
        # Past ~96 open PRs `--argjson prs "$PRS"` hit "Argument list too long" and keep-fresh wiped its state every pass.
        run: bash scripts/check-argv-json.sh
      - name: A status label is set only through issue-status.sh
        # A step that added its status and removed only the one it expected left
        # tickets wearing ready, claimed, in-review and partial at once.
        run: bash scripts/check-status-label-writes.sh
      - name: A failed GitHub read is never an empty one
        # A refused call read as no rows listed 1 open ticket, then 0, while 17 and 18 were open.
        run: bash scripts/check-gh-read.sh
      - name: No unattended build runs the prose claim
        # A prose fallback left wired in after the driver could take the case sent drafts and pick-next to prose.
        run: bash scripts/check-driver-only-spawn.sh
      - name: Changed shell scripts pass shellcheck and bound their network calls
        # The same fast check a project lists in gates.local; the runner image carries shellcheck.
        run: |
          command -v shellcheck >/dev/null || { echo "shellcheck is missing from the runner, so this check would skip"; exit 1; }
          bash scripts/check-changed-shell.sh --base "origin/${{ github.base_ref || 'main' }}"

  tests:
    # The suites split by measured time (.github/ci/suite-seconds.tsv). The wall clock
    # is the slowest shard, so the longest suite sets the floor.
    name: tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests
        run: |
          fail=0
          mine=$(bash .github/ci/shard.sh "${{ strategy.job-total }}" "${{ strategy.job-index }}")
          [ -n "$mine" ] || { echo "shard ${{ strategy.job-index }} was given no suites"; exit 1; }
          times=$(mktemp)
          for t in $mine; do
            echo "== $t"; s=$SECONDS
            bash .github/ci/run-suite.sh "$t" || { echo "FAILED: $t"; fail=1; }
            printf '%s\t%s\n' $((SECONDS - s)) "$t" >> "$times"
          done
          echo "== seconds per suite (refresh .github/ci/suite-seconds.tsv from these)"
          sort -rn "$times"
          exit $fail

  kit:
    # The one check name that stands for the whole of CI.
    needs: [lint, tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        run: |
          echo "lint=${{ needs.lint.result }} tests=${{ needs.tests.result }}"
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.tests.result }}" = success ]
