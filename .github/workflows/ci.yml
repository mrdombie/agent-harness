name: CI
on: [push, pull_request]
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests parse
        run: |
          jq . .claude-plugin/plugin.json >/dev/null
          jq . .claude-plugin/marketplace.json >/dev/null
          jq . hooks/hooks.json >/dev/null
      - name: Manifest validates against the CLI's own schema
        # JSON that parses is not a manifest the CLI accepts: `"agents": "./agents/"`
        # parsed fine and `claude plugin install` refused it (2026-09-20).
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate .
      - name: Scripts and hooks parse
        run: |
          for f in scripts/*.sh hooks/*.sh hooks/lib/*.sh swarm/*.sh swarm/tests/*.sh \
                   briefs/*.sh briefs/tests/*.sh \
                   driver/*.sh driver/steps/*.sh driver/tests/*.sh driver/build-ticket; do
            bash -n "$f"
          done
      - name: Self-tests
        run: |
          fail=0
          # Every tracked suite, globbed by directory. A suite CI does not glob
          # is a suite that is not run, and it reports green by never reporting
          # at all — hooks/lib/ was invisible that way once, and swarm/tests/
          # shipped six suites nothing here could see.
          ran=$(mktemp)
          for t in hooks/*.test.sh hooks/lib/*.test.sh scripts/*.test.sh swarm/tests/*.test.sh briefs/tests/*.test.sh driver/tests/*.test.sh; do
            [ -f "$t" ] || continue
            echo "== $t"; echo "$t" >> "$ran"
            bash "$t" || fail=1
          done
          # The backstop for the next directory somebody adds: a tracked suite
          # that no glob above reached fails the build by name rather than
          # passing in silence.
          # reference/ is excluded and must stay excluded: it holds the copies
          # this plugin replaced, kept verbatim so a reader can see what the
          # live version was reconciled FROM. Nothing loads them and they are
          # not maintained, so running them would fail on the project they were
          # written for. The exclusion is one path prefix, so a NEW suite
          # anywhere else still fails this check by name.
          missed=$(comm -23 <(git ls-files '*.test.sh' | grep -v '^reference/' | sort) <(sort "$ran"))
          if [ -n "$missed" ]; then
            echo "these suites exist and nothing ran them — add their directory to the loop above:"
            printf '%s\n' "$missed" | sed 's/^/  /'
            fail=1
          fi
          exit $fail
      - name: The kit names no project
        run: bash scripts/check-project-agnostic.sh
      - name: Our own skills are addressed with the kit
        # A bare /claim in the kit's own instructions resolves to whichever copy
        # the machine carries. Three were reachable on the origin machine and they
        # disagreed by 474 lines; the one that loaded was never the kit's.
        run: bash scripts/check-skill-namespacing.sh
