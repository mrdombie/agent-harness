name: Release
# Every merge to main raises the patch version, so `claude plugin update` sees it.
# Until this, the version was raised by hand in the PR, and on 2026-09-30 two of
# three merges (#35 Windows swarm, #44 held swarm) forgot — `plugin update` said
# "already at the latest version" and no machine received them. Raising it here
# instead of in each PR also means parallel PRs never clash on the version line.
on:
  push:
    branches: [main]
concurrency: { group: release, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Raise the patch version unless this push already did
        run: |
          set -euo pipefail
          f=.claude-plugin/plugin.json
          if git diff --name-only HEAD~1 HEAD | grep -qx "$f" && \
             [ "$(git show HEAD~1:$f | jq -r .version)" != "$(jq -r .version $f)" ]; then
            echo "this push already moved the version — nothing to do"; exit 0
          fi
          old=$(jq -r .version "$f")
          new=$(echo "$old" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
          jq --arg v "$new" '.version=$v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          [ "$(jq -r .version "$f")" = "$new" ] || { echo "version write did not land"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore: $new — $(git log -1 --format=%s HEAD | cut -c1-80)"
          git push origin HEAD:main
          echo "raised $old -> $new"
