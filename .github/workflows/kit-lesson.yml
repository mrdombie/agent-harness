# The kit holds itself to its own lesson check. lesson.yml takes the script from the
# pull request's BASE commit when the kit judges itself, so harness-ref is not used
# here and a pull request cannot loosen its own judge. The default guard patterns
# already cover the kit's *.test.sh suites and check-* scripts.
#
# Switched off (the owner, 2026-11-02: the driver's 3-voter review replaces the lesson
# check). It runs only by hand; no pull request triggers it.
name: Kit lesson
on:
  workflow_dispatch:
jobs:
  lesson:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/lesson.yml
    with:
      harness-repo: ${{ github.repository }}
