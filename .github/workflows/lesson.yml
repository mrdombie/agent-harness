# Lesson — a fix pull request names, in its body, the guard that stops the same
# class of mistake coming back, and that guard is a test, lint or gate file the
# diff adds or changes. The check itself is scripts/check-lesson.sh; this is the
# CI seat for it, so it holds on every pull request whether or not anybody ran a skill.
#
# A consuming repo calls it from a workflow of its own:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
#     merge_group:
#   jobs:
#     lesson:
#       uses: <owner>/agent-harness/.github/workflows/lesson.yml@<sha>
#       with:
#         harness-repo: <owner>/agent-harness
#         harness-ref: <the same sha>
#
# and names the check "Lesson / Every fix ships a lesson" under gates.requiredChecks
# and in branch protection. What counts as a fix and as a guard comes from the
# `lesson` block of the consuming repo's .claude/harness.json, read at the base.
name: Lesson
on:
  workflow_call:
    inputs:
      harness-repo:
        description: owner/name of the agent-harness repo to take the check from
        type: string
        required: true
      harness-ref:
        description: the ref of it to take the check from
        type: string
        default: main
      guard-patterns:
        description: space-separated guard-file globs; overrides lesson.guardPatterns in harness.json
        type: string
        default: ''
      runs-on:
        description: JSON for runs-on — a label string or a list of labels
        type: string
        default: '"ubuntu-latest"'
    secrets:
      harness_token:
        description: a token that can read harness-repo, when it is private and not this repo
        required: false

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  lesson:
    name: Every fix ships a lesson
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      # A queued group was already checked, body and labels, on its own pull_request run.
      - name: Only a pull request has a body to read a lesson from
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        run: echo "not a pull request (${{ github.event_name }}) — nothing to check"
      # The merge commit, two parents deep: HEAD^1..HEAD is exactly what merging adds.
      - name: Check out the pull request's merge commit
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          path: repo
      - name: Check out the check
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.harness-repo }}
          ref: ${{ inputs.harness-ref }}
          token: ${{ secrets.harness_token || github.token }}
          path: kit
          sparse-checkout: scripts
      - name: A fix names its guard, and the guard is in the diff
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HARNESS_GUARD_PATTERNS: ${{ inputs.guard-patterns }}
        run: |
          # Body, labels and closing issues are read fresh from GitHub, not from the
          # event: a re-run carries the event as it was when the job first fired.
          [ -n "$HARNESS_GUARD_PATTERNS" ] || unset HARNESS_GUARD_PATTERNS
          bash kit/scripts/check-lesson.sh --repo repo --base HEAD^1 --head HEAD \
            --pr "$PR" --slug "$REPO"
